name: Continuous Secret Scan

on:
  push:
  schedule:
    # 09:00 UTC daily — GitHub Actions cron is always UTC. Runs
    # independent of push activity so secrets introduced any other way
    # (e.g. a change made directly on GitHub) are still caught.
    - cron: '0 9 * * *'

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      # Full history of THIS repo is required: secretscan walks every
      # commit's diff to find secrets that were added and later removed,
      # which is invisible from a shallow (default) clone.
      #
      # Checked out to target-repo/ rather than the workspace root: both
      # this repo and the tool repo (below) need to sit as siblings under
      # $GITHUB_WORKSPACE, each in its own named subfolder. actions/checkout
      # refuses any path that resolves outside the workspace directory
      # ("Repository path ... is not under ...") — so a layout that tried
      # to put the tool at ../scanner-tool (a sibling of the workspace
      # itself, one level up) fails outright. Two workspace-relative
      # subfolders is the only layout that satisfies both constraints:
      # the tool isn't nested inside the repo being scanned (see the tool
      # checkout step below for why that matters), and neither checkout
      # path ever leaves the workspace.
      - name: Check out this repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target-repo

      # The scanner tool lives in a separate repository. Checked out to
      # scanner-tool/ — a SIBLING of target-repo/ under the workspace
      # root, not a subdirectory inside it. This matters: the scan step
      # below points secretscan directly at ./target-repo, and if the
      # tool were nested inside that path it would end up scanning its
      # own source as if it were part of the repo being audited —
      # including its 883-pattern config/rules-stable.yml, which alone
      # is expensive enough (6,449 lines x 883 patterns) to turn a
      # few-second scan into a multi-minute one. Keeping the tool in its
      # own sibling folder avoids that entirely, with no need for any
      # exclude-list in secretscan itself to compensate.
      - name: Check out secret-scanner-pipeline tool
        uses: actions/checkout@v4
        with:
          repository: zakaria10jbr/secret-scanner-pipeline
          path: scanner-tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --------------------------------------------------------------
      # Why this cache step exists (read before changing/removing it):
      #
      # --baseline only suppresses already-seen findings if the
      # baselines/ file from the PREVIOUS run is available to the tool.
      # GitHub Actions runners are ephemeral — nothing on disk survives
      # between jobs unless it's explicitly restored — so without this
      # step, every run would start from an empty baseline and
      # --baseline would behave as if it were the first run every time,
      # defeating its entire purpose.
      #
      # actions/cache does NOT update a cache in place: saving to an
      # already-existing key is a silent no-op. A fixed key would
      # therefore restore the very first baseline forever and never
      # pick up newer scans. To get an ever-growing baseline, the SAVE
      # key includes the unique run ID (so a fresh cache entry is
      # always written at the end of every run), while `restore-keys`
      # does a prefix match to pull in the most recent prior run's
      # baseline before the scan starts.
      #
      # Path is baselines/ at the WORKSPACE ROOT, not target-repo/baselines/
      # — secretscan writes it relative to its own process working
      # directory (this step's default, $GITHUB_WORKSPACE), not relative
      # to whatever --path it was told to scan. Same reasoning applies to
      # the reports/ path in the upload step below.
      # --------------------------------------------------------------
      - name: Cache secretscan baselines
        uses: actions/cache@v4
        with:
          path: baselines/
          key: secretscan-baseline-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            secretscan-baseline-${{ github.repository }}-

      - name: Install secretscan
        run: pip install -e ./scanner-tool

      # Scan the target repo's own checkout specifically — never
      # scanner-tool/, since it's a separate sibling folder, not nested
      # inside target-repo/.
      - name: Run secret scan
        run: secretscan --path ./target-repo --baseline --summary

      # reports/ lands at the workspace root (see the cache step comment
      # above for why) — not target-repo/reports/.
      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: reports/
